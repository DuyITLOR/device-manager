services:
  # ─── NestJS API Server ───────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: device-manager-server
    ports:
      - "5050:5050"
    # Environment variables loaded from server/.env at runtime (not baked into image)
    env_file:
      - ./server/.env
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5050/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Next.js Web Client ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_API_URL phải là URL mà browser của user có thể reach được.
        # Local:      http://localhost:5050
        # Production: http://<SERVER_PUBLIC_IP>:5050 hoặc https://api.yourdomain.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5050}
    container_name: device-manager-web
    ports:
      - "4000:4000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
